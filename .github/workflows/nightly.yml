name: nightly

# Manual only. Builds the current main into a dev-versioned wheel and replaces
# the rolling `nightly` prerelease, so there is exactly one nightly to download.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project + dev dependencies
        run: uv sync --extra dev --python 3.12

      - name: Lint (ruff)
        run: uv run ruff check src/vllmops tests

      - name: Type-check (mypy)
        run: uv run mypy --no-incremental

      - name: Type-check (pyright)
        run: uv run pyright

      - name: Tests (pytest)
        run: uv run pytest -q

      - name: Compute the dev version
        id: version
        run: |
          BASE="$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          echo "version=${BASE}.dev$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      # Patched in the checkout only. __version__ comes from importlib.metadata,
      # so the built package reports this version by itself.
      - name: Patch the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("pyproject.toml")
          new, count = re.subn(
              r'^version = ".*"$',
              f'version = "{os.environ["VERSION"]}"',
              path.read_text(encoding="utf-8"),
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("no version line found in pyproject.toml")
          path.write_text(new, encoding="utf-8")
          PY

      - name: Build sdist + wheel
        run: uv build

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          Unreleased build of `main`, for testing only. Every run replaces this
          release and its tag, so the link below always points at the latest one.

          - version: `__VERSION__`
          - commit: __SHA__
          - built: __DATE__

          Install it (resolves the wheel from this page, so the command does not
          change when the filename does):

          ```bash
          uv tool install --force "$(curl -sL \
            https://api.github.com/repos/__REPO__/releases/tags/nightly \
            | grep -o 'https://[^"]*\.whl')"
          vllmops --version
          ```
          EOF
          sed -i \
            -e "s|__VERSION__|$VERSION|g" \
            -e "s|__SHA__|$GITHUB_SHA|g" \
            -e "s|__DATE__|$(date -u '+%Y-%m-%d %H:%M UTC')|g" \
            -e "s|__REPO__|$GITHUB_REPOSITORY|g" \
            notes.md

      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "nightly $VERSION ($(git rev-parse --short HEAD))" \
            --notes-file notes.md
